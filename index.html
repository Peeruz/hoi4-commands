<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钢铁雄心4 指令台 · 中文需求转控制台指令</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <button id="settingsBtn" class="gear" title="设置（大模型兜底，默认关闭）">⚙</button>
    <div class="hero-inner">
      <h1>钢铁雄心 4 · 指令台</h1>
      <p>用中文描述需求，一键生成可复制进游戏的控制台指令</p>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="query">自然语言查询</button>
    <button class="tab" data-tab="ref">指令大全</button>
  </nav>

  <main>
    <!-- 自然语言查询 -->
    <section id="tab-query" class="panel active">
      <div class="query-box">
        <textarea id="queryInput" rows="3" placeholder="例如：给伊朗 10000 个钢 / 吞并日本 / 切换美国 / 加速到 3 倍 / 给德国加 50 万人力"></textarea>
        <div class="row">
          <button id="genBtn" class="primary-btn">生成指令</button>
          <span class="hint">支持中文数字（如“一万”“五十万”）与国家中文名</span>
        </div>
        <div class="examples">
          <button class="chip" data-q="给伊朗 10000 个钢">给伊朗 10000 个钢</button>
          <button class="chip" data-q="吞并日本">吞并日本</button>
          <button class="chip" data-q="切换美国">切换美国</button>
          <button class="chip" data-q="加速到 3 倍">加速到 3 倍</button>
          <button class="chip" data-q="给德国加 50 万人力">给德国加 50 万人力</button>
          <button class="chip" data-q="研究所有科技">研究所有科技</button>
        </div>
      </div>
      <div id="result" class="result hidden"></div>
    </section>

    <!-- 指令大全 -->
    <section id="tab-ref" class="panel">
      <div class="ref-controls">
        <input id="refSearch" type="text" placeholder="搜索指令 / 中文说明 / 标签（如 吞并、资源、peace）" />
        <select id="refCat">
          <option value="">全部分类</option>
        </select>
      </div>
      <div id="refList" class="ref-list"></div>
    </section>
  </main>

  <!-- 设置弹窗（含 API 接入，默认隐藏） -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>设置 · 大模型兜底</h2>
        <button id="closeSettings" class="ghost-btn">✕</button>
      </div>
      <p class="modal-tip">纯静态网页无法保密调用大模型，请填入<strong>你自己的</strong> API 信息（仅保存在本机浏览器）。规则引擎始终离线工作，兜底仅在规则无法识别时启用。</p>
      <label class="ck"><input type="checkbox" id="llmEnabled" /> 启用大模型兜底</label>
      <label>API 地址（Base URL）
        <input id="llmBase" type="text" placeholder="https://api.openai.com/v1" />
      </label>
      <label>API Key
        <input id="llmKey" type="password" placeholder="sk-..." />
      </label>
      <label>模型名
        <input id="llmModel" type="text" placeholder="gpt-4o-mini" />
      </label>
      <div class="modal-actions">
        <button id="saveSettings" class="primary-btn">保存</button>
        <span id="settingsStatus" class="hint"></span>
      </div>
    </div>
  </div>

  <footer class="foot">背景图来自 Hearts of Iron IV 官方宣传素材（Paradox Interactive）· 指令仅供单机/学习使用</footer>

  <script src="js/data/countries.js"></script>
  <script src="js/data/misc.js"></script>
  <script src="js/data/commands.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
